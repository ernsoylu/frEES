name: Bug Report
description: Report an issue or unexpected behavior in the frees web app or CLI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps & Model Code
      description: Provide the exact .frees model code or steps to reproduce the behavior.
      placeholder: |
        1. Open https://frees.dev
        2. Enter the following equations:
           x + y = 10
           x * y = 25
        3. Click 'Solve'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser version, OS, or CLI version (e.g. Chrome 128 on Linux, macOS Safari 17.5).
    validations:
      required: true
