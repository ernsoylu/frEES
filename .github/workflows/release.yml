name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: frees-cli
            artifact_name: frees-cli-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: frees-cli
            artifact_name: frees-cli-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI binary
        run: cargo build --locked --release -p frees-cli --target ${{ matrix.target }}
      - name: Package CLI binary
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ matrix.artifact_name }}

  build-web-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d6771d9d307f62b1b369963e6ef66cb8cc1ba78 # v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Build WASM package
        run: wasm-pack build crates/frees --release --target web --out-dir ../../web/src/wasm/pkg
      - name: Package WASM artifact
        run: tar -czvf frees-wasm-pkg.tar.gz -C web/src/wasm pkg
      - name: Build web distribution
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          tar -czvf ../frees-web-dist.tar.gz dist/
      - name: Upload WASM & Web Dist Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} frees-wasm-pkg.tar.gz frees-web-dist.tar.gz
